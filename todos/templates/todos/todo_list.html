<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            padding: 12px;
            margin-bottom: 10px;
            background: #eee;
            display: flex;
            justify-content: space-between;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Todo List</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="title"
            placeholder="Enter a todo..."
            required
        >

        <button type="submit">
            Add Todo
        </button>

    </form>

    <ul>

        {% for todo in todos %}

            <li>

                <span class="{% if todo.completed %}completed{% endif %}">
                    {{ todo.title }}
                </span>

                <span>

                    <a href="{% url 'complete_todo' todo.id %}">
                        {% if todo.completed %}
                            Undo
                        {% else %}
                            Complete
                        {% endif %}
                    </a>

                    <a href="{% url 'delete_todo' todo.id %}">
                        Delete
                    </a>

                </span>

            </li>

        {% empty %}

            <li>No todos yet.</li>

        {% endfor %}

    </ul>

</div>

</body>
</html>
